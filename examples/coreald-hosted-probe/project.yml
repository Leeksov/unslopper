name: CoreALDHostedProbe
options:
  bundleIdPrefix: com.leeksov
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: F8A8NWPL78
targets:
  CoreALDHostedProbe:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ['**/*.py']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeksov.corealdhostedprobe
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: DownloaderExtension
        embed: true
  DownloaderExtension:
    type: extensionkit-extension
    platform: iOS
    sources: [Extension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeksov.corealdhostedprobe.downloader
        INFOPLIST_FILE: Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extension/Extension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
